# Autoencoder Equipment Health Monitoring — dvn_data_1 (real historian export) config
# Derived from default.yaml. Real sampling is 1-min (verified from data), not the
# synthetic generator's 15-sec, so a 120-row window is a 2-hour aggregation window
# here instead of 30 minutes. window_rows is left at 120 (matches the best-known
# config) since nothing downstream depends on the wall-clock duration it represents.

data:
  frequency_seconds: 60       # real data: ~1 sample/min (verified), not 15s
  window_rows: 120            # 2 hours at 1-min intervals (see note above)
  timestamp_column: "datetime"

preprocessing:
  scaler: "robust"            # RobustScaler: (X - median) / IQR, fit on train split only
  sensor_dropout:
    threshold_pct: 30         # Real historian data (unlike the synthetic generator) is deadband/
                               # compression-logged: even the cleanest tags read as flat ("stuck")
                               # in ~18-24% of any 2-hour window just from normal storage behaviour
                               # (verified empirically on this dataset -- p90 natural floor was
                               # 23.5%, genuine outage windows jump to 45%+ bad sensors). The 5%
                               # default assumes always-noisy synthetic data and would reject 98%
                               # of real windows as "bad" when they're actually fine. 30% sits
                               # above the natural floor and below the outage floor.

regime:
  method: "kmeans"
  n_clusters: 3               # Low / Medium / High
  features:                    # None of these match dvn's real tag names, so
    - "speed"                  # regime segmentation falls back to PCA-based
    - "power"                  # unsupervised clustering (same as the synthetic
    - "discharge_pressure"     # runs, which also don't match these placeholder names)

transient:
  speed_change_threshold_pct: 15   # % of operating range

cleaning:
  order:
    - "isolation_forest"
    - "pca"
    - "mahalanobis"
  isolation_forest:
    contamination: 0.05
    n_estimators: 200
    random_state: 42
  pca:
    variance_threshold: 0.95   # Retain components explaining 95% variance
    outlier_std: 3.0           # Flag points > 3 std in PCA space
  mahalanobis:
    chi2_percentile: 97.5      # Flag points above 97.5th percentile of chi2 distribution
  max_removal_pct: 40          # Warn if >40% of data removed overall

model:
  latent_dim_rule: "max(8, N//8)"
  encoder_layers: [128, 64, 32]
  decoder_layers: [32, 64, 128]
  dropout: 0.2
  norm: "layer"               # LayerNorm, not BatchNorm -- batches are single autocorrelated windows
  loss: "mse"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 10
  max_epochs: 150
  early_stopping_patience: 15
  overfit_ratio_threshold: 1.5 # Flag if val/train loss ratio exceeds this
  batch_size_rows: 256         # shuffled rows across all windows per gradient update --
                               # deviates from spec's 1-window-per-step recipe, which empirically
                               # never converges on this data (verified: normalization-independent)
  splits:
    train: 0.85
    val: 0.10
    test: 0.05
  seed: 42                     # null = unseeded (legacy behaviour); set for reproducible training runs

thresholds:
  green_yellow: 90             # P90 of calibration error distribution
  yellow_red: 99               # P99 of calibration error distribution
  method: "robust"             # "robust" (default) or "percentile" -- see configs/default.yaml
                                # for the full explanation of the median+z*MAD-on-log(score) logic
  spread: "mad"                # "mad" (default) or "iqr"
  calibration_source: "val"    # "val" (recommended) or "train". Ablation study
                                # (output_ablation_full_seeded/, 3 seeds) showed
                                # val-calibration raises Red F1 0.884->0.916 and
                                # any-flag precision 0.336->0.529 at ~0 recall cost --
                                # train-error calibration is optimistic since those
                                # are exactly the windows the model fit well.
  score_aggregation: "p95"     # 95th percentile of 120 per-row errors

alerting:
  persistence:
    red_to_yellow_alert: 2     # 2 consecutive Red → Yellow alert
    red_to_red_alert: 3        # 3+ consecutive Red → Red alert
    yellow_consecutive: 4      # 4+ consecutive Yellow → Yellow alert
    mixed_window_hours: 2      # Mixed Red+Yellow within 2 hours → Yellow alert

inference:
  missing_data:
    max_consecutive_nulls_ffill: 3
    max_null_pct_per_sensor: 5
  sensor_flag_threshold: 3.0        # error ratio above which sensor is flagged
  anomaly_sensor_pct: 10.0          # % of flagged sensors to declare anomalous
  running_sensor_column: null       # sensor name/index for running detection (null = skip)
  running_threshold: 0.0            # min value for "running"
  attribution_method: "heuristic"   # "heuristic" (default) or "integrated_gradients" -- see
                                     # configs/default.yaml for the full explanation
  integrated_gradients:
    n_steps: 50
    baseline: 0.0

explainability:
  enabled: false                # opt-in FastSHAP explainer; false = existing per-sensor MSE heuristic
  hidden_dim: 128
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0              # L2 reg here fights the input-sensitivity FastSHAP needs (verified)
  max_epochs: 100
  early_stopping_patience: 10
  lr_scheduler:
    factor: 0.5
    patience: 5
  n_mask_samples: 32
  batch_size: 256
  seed: 42

monitoring:
  rolling_error_window_days: 7
  drift_weeks_threshold: 6
  false_alarm_rate_multiplier: 2.0
  sensor_dropout_hours: 48
  ks_test_significance: 0.01
  ks_test_min_sensors: 5

reporting:
  format: "html"               # html or pdf
  include_plots: true
  sensor_pairs_to_plot: 10
